services:
  payment-db:
    image: postgres:15
    container_name: component-postgresql
    restart: always
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: payment_component
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pswd
    volumes:
      - payment_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  payment_data: